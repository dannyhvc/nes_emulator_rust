[package]
name = "nes_emulator"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
# default = ["debug"] /// add this so that the 
default = ["debug"]
debug = ["iced"]
iced = ["dep:iced"]

[dependencies]
anyhow = "1.0.71"
features = "0.10.0"
geometry = "0.2.0"
iced = { version = "0.13.1", features = ["debug", "advanced", "lazy" ], optional = true }
iced_aw = "0.11.0"
# iced_table = "0.12.0"
once_cell = "1.18.0"

[dev-dependencies]
tracing = {version = "0.1.40" }
rstest = "*"

[profile.release]
codegen-units = 1
