[package]
name = "debug"
version = "0.1.0"
edition = "2021"

[dependencies]
features = "0.10.0"
geometry = "0.2.0"
iced = { version = "0.13.1", features = ["debug", "advanced", "lazy", "tokio"] }
iced_aw = "0.11.0"
# coffee = { version = "0.4", features = ["opengl"] }
log = "0.4.22"
pretty_env_logger = "0.5.0"
components = { path = "../components", features = ["debug"], version ="0.1.0" }
eyre = "0.6.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
anyhow = "1.0.99"


[dev-dependencies]
tracing = { version = "0.1.40" }
rstest = "*"
