[package]
name = "nes_debugger"
version = "0.1.0"
edition = "2021"

[dependencies]
features = "0.10.0"
geometry = "0.2.0"
iced = { version = "0.12.1", features = ["debug", "advanced", "lazy", "canvas", "async-std", "highlighter", "iced_highlighter", "image", "multi-window", "palette"], optional = true }
iced_aw = "0.9.3"
iced_graphics = { version = "0.12.1", features = ["geometry"] }
iced_renderer = "0.12.1"
iced_style = "0.12.1"
# iced_table = "0.12.0"

[dev-dependencies]
tracing = {version = "0.1.40" }



